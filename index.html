<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해솔동건놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2140;
  --sky:#6FC9F2;
  --mint:#5FD3A6;
  --sun:#FFC93C;
  --coral:#FF7A6B;
  --grape:#B79BFF;
  --peach:#FF9F5C;
  --paper:#E7F1FB;
  --card:#FFFFFF;
  --shadow:0 8px 0 var(--ink);
  --shadow-sm:0 5px 0 var(--ink);
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(rgba(255,255,255,.9) 2px, transparent 2px);
  background-size:22px 22px;
  overflow-x:hidden;
}
h1,h2,h3,button,.jua{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400}

#app{max-width:820px;margin:0 auto;padding:14px 14px 40px;min-height:100%}

/* ── 상단바 ───────────────────────────── */
#topbar{
  display:none;align-items:center;gap:10px;margin-bottom:14px;
}
#topbar.show{display:flex}
.chip{
  font-family:'Jua',sans-serif;font-size:18px;line-height:1;
  background:var(--card);border:4px solid var(--ink);border-radius:999px;
  padding:12px 18px;box-shadow:var(--shadow-sm);cursor:pointer;color:var(--ink);
  transition:transform .08s, box-shadow .08s;
}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.chip.ghost{background:#fff}
#topTitle{
  flex:1;text-align:center;font-family:'Jua',sans-serif;font-size:22px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── 화면 전환 ─────────────────────────── */
.screen{display:none;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.screen.is-active{display:block}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}

/* ── 홈 ───────────────────────────────── */
.home-head{text-align:center;padding:18px 0 6px}
.eyebrow{
  display:inline-block;font-family:'Jua',sans-serif;font-size:15px;
  background:var(--sun);border:3px solid var(--ink);border-radius:999px;
  padding:6px 16px;transform:rotate(-2deg);box-shadow:0 4px 0 var(--ink)
}
.home-title{
  font-size:clamp(38px,10vw,64px);margin:16px 0 6px;line-height:1;
  letter-spacing:-1px;
}
.home-title span{display:inline-block}
.home-title span:nth-child(odd){color:var(--coral);transform:rotate(-4deg)}
.home-title span:nth-child(even){color:var(--sky);transform:rotate(4deg)}
.home-sub{font-size:17px;opacity:.75;margin:0 0 20px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:26px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{
  position:relative;border:5px solid var(--ink);border-radius:var(--r);
  padding:18px 10px 14px;text-align:center;cursor:pointer;
  box-shadow:var(--shadow);background:var(--card);
  transition:transform .1s, box-shadow .1s;
}
.tile:active{transform:translateY(6px) rotate(0deg)!important;box-shadow:0 2px 0 var(--ink)}
.tile-emoji{font-size:clamp(40px,11vw,56px);line-height:1;display:block}
.tile-name{font-family:'Jua',sans-serif;font-size:clamp(17px,4.6vw,21px);margin-top:8px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.tile-stars{height:20px;margin-top:6px;font-size:14px;letter-spacing:1px}
.tile.locked{filter:grayscale(.85);opacity:.85}
.tile .lock{
  position:absolute;top:-10px;right:-8px;font-size:30px;
  background:#fff;border:4px solid var(--ink);border-radius:50%;
  width:46px;height:46px;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)
}
.tile .cost{
  position:absolute;top:-10px;left:-8px;font-family:'Jua',sans-serif;font-size:15px;
  background:#fff;border:4px solid var(--ink);border-radius:999px;padding:3px 10px;box-shadow:0 3px 0 var(--ink)
}

/* 별 보유량 */
.star-bank{
  background:#2B2140;border:5px solid var(--ink);border-radius:22px;
  padding:12px 14px;box-shadow:var(--shadow);margin-bottom:22px;color:#fff
}
.bank-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.bank-label{font-family:'Jua',sans-serif;font-size:19px}
.bank-num{font-family:'Jua',sans-serif;font-size:19px;color:var(--sun)}
.bank-slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.slot{aspect-ratio:1;border-radius:50%;background:#3E3557;display:grid;place-items:center;font-size:clamp(12px,3.4vw,18px)}
.slot.on{background:#FFC93C}

/* 카테고리 머리말 */
.cat{display:flex;align-items:center;gap:8px;margin:0 4px 12px;flex-wrap:wrap}
.cat-ico{font-size:26px}
.cat-name{font-family:'Jua',sans-serif;font-size:23px}
.cat-note{
  font-family:'Jua',sans-serif;font-size:14px;border:3px solid var(--ink);border-radius:999px;
  padding:3px 10px;background:#fff
}
.cat-earn .cat-note{background:#FFE9A8}
.cat-spend .cat-note{background:#FFD3CC}

/* ── 옵션(난이도) 화면 ───────────────────── */
.panel{
  background:var(--card);border:5px solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px 18px;text-align:center
}
.panel h2{font-size:26px;margin:4px 0 4px}
.panel p{margin:0 0 18px;opacity:.7}
.opt-list{display:grid;gap:14px}
.opt{
  font-family:'Jua',sans-serif;font-size:22px;color:var(--ink);
  border:4px solid var(--ink);border-radius:20px;padding:16px;
  box-shadow:var(--shadow-sm);cursor:pointer;background:#fff;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .08s, box-shadow .08s;
}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt.o1{background:#CFF3E3}.opt.o2{background:#FFE9A8}.opt.o3{background:#FFD3CC}.opt.o4{background:#DDD6FF}
.opt{flex-direction:column;gap:2px}
.opt-ico{font-size:clamp(24px,7vw,32px);line-height:1.2;letter-spacing:2px}
.opt .earn{
  font-family:'Jua',sans-serif;font-size:14px;background:#FFC93C;border:3px solid var(--ink);
  border-radius:999px;padding:2px 10px;margin-top:4px
}
.locked-note{
  background:#FFF0CC;border:5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-sm);
  padding:14px;margin:0 4px 22px;text-align:center;font-family:'Jua',sans-serif;font-size:18px
}
.locked-note .big{font-size:34px;display:block;margin-bottom:4px}
.opt small{font-family:'Gowun Dodum',sans-serif;font-size:14px;opacity:.65}

/* ── 게임판 공통 ────────────────────────── */
.playhead{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pips{display:flex;gap:6px}
.pip{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.pip.on{background:var(--sun)}
.banner{
  font-family:'Jua',sans-serif;font-size:20px;background:#fff;border:4px solid var(--ink);
  border-radius:999px;padding:10px 20px;box-shadow:var(--shadow-sm)
}
#stage{min-height:40vh}

/* ── 1. 도형찾기 ───────────────────────── */
.target-box{
  background:#fff;border:5px solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;text-align:center;margin-bottom:18px
}
.target-box svg{width:min(38vw,150px);height:min(38vw,150px)}
.shape-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.shape-grid.many{grid-template-columns:repeat(3,1fr)}
.shape-grid.lots{grid-template-columns:repeat(4,1fr);gap:10px}
@media(min-width:520px){
  .shape-grid.many{grid-template-columns:repeat(5,1fr)}
  .shape-grid.lots{grid-template-columns:repeat(5,1fr)}
}
.shape-btn{
  background:#fff;border:4px solid var(--ink);border-radius:20px;padding:10px;
  box-shadow:var(--shadow-sm);cursor:pointer;display:grid;place-items:center;
  transition:transform .08s, box-shadow .08s
}
.shape-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.shape-btn svg{width:100%;height:auto;max-height:110px;display:block}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.correct-pop{animation:cpop .5s}
@keyframes cpop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ── 2. 기억력 ─────────────────────────── */
.mem-grid{display:grid;gap:12px;justify-content:center}
.mcard{perspective:700px;cursor:pointer;aspect-ratio:3/4}
.mcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.mcard.flipped .mcard-inner{transform:rotateY(180deg)}
.mface{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:4px solid var(--ink);border-radius:18px;display:grid;place-items:center;
  font-size:clamp(28px,9vw,46px);box-shadow:var(--shadow-sm)
}
.mface.front{
  background:repeating-linear-gradient(45deg,var(--sky) 0 12px,#8FDAF7 12px 24px);
  font-size:clamp(20px,6vw,30px)
}
.mface.back{background:#fff;transform:rotateY(180deg)}
.mcard.done .mface.back{background:#D9F7E7}
.mcard.done{opacity:.75}

/* ── 3. 틱택토 ─────────────────────────── */
.ttt-board{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--sun);
  border:5px solid var(--ink);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);
  width:min(88vw,380px);margin:0 auto;
}
.ttt-board.big{grid-template-columns:repeat(5,1fr);gap:7px;padding:9px;width:min(92vw,470px)}
.ttt-board.big .ttt-cell{border-width:3px;border-radius:13px}
.ttt-board.big .stone{border-width:3px}
.ttt-cell{
  aspect-ratio:1;background:#FFF3D0;border:4px solid var(--ink);border-radius:16px;
  display:grid;place-items:center;cursor:pointer;transition:transform .08s
}
.ttt-cell:active{transform:scale(.96)}
.ttt-cell.win{background:#C9F7DD}
.stone{width:74%;height:74%;border-radius:50%;border:4px solid var(--ink);animation:drop .25s cubic-bezier(.2,1.5,.4,1)}
.stone.black{background:radial-gradient(circle at 32% 28%,#7a7a8f,#1b1626 62%)}
.stone.white{background:radial-gradient(circle at 32% 28%,#ffffff,#d6d6e2 70%)}
@keyframes drop{from{transform:scale(.2)}to{transform:scale(1)}}
.turnbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.turn-stone{width:34px;height:34px;border-radius:50%;border:4px solid var(--ink)}

/* ── 4. 가위바위보 ─────────────────────── */
.rps-wrap{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.signal{
  background:#3A3350;border:5px solid var(--ink);border-radius:22px;padding:10px 8px;
  display:grid;gap:8px;justify-items:center;box-shadow:var(--shadow-sm)
}
.lamp{width:clamp(26px,8vw,38px);height:clamp(26px,8vw,38px);border-radius:50%;background:#1E1A2B;border:3px solid #0e0b18}
.lamp.on.me{background:#5FD3A6;box-shadow:0 0 16px #5FD3A6}
.lamp.on.cpu{background:#FF7A6B;box-shadow:0 0 16px #FF7A6B}
.signal .who{font-family:'Jua',sans-serif;color:#fff;font-size:13px}
.arena{
  background:#fff;border:5px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);
  padding:14px 8px;text-align:center;min-height:170px;display:grid;align-content:center;gap:6px
}
.hands{display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(40px,13vw,68px)}
.hand{width:1.35em;height:1.35em;display:grid;place-items:center;border:4px solid var(--ink);border-radius:24px;background:#F6F2FF}
.vs{font-family:'Jua',sans-serif;font-size:20px}
.rps-result{font-family:'Jua',sans-serif;font-size:24px;min-height:30px}
.rps-pick{display:flex;gap:12px;justify-content:center;margin-top:18px}
.pickbtn{
  font-size:clamp(34px,11vw,52px);background:#fff;border:5px solid var(--ink);border-radius:24px;
  padding:10px 6px;width:30%;box-shadow:var(--shadow);cursor:pointer;transition:transform .08s, box-shadow .08s
}
.pickbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.pickbtn div{font-family:'Jua',sans-serif;font-size:16px;margin-top:2px}
.thinking{animation:wob .35s infinite alternate}
@keyframes wob{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}

/* ── 5. 한글 맞추기 ────────────────────── */
.word-box{
  background:#fff;border:5px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);
  padding:18px;text-align:center;margin-bottom:18px
}
.word{font-family:'Jua',sans-serif;font-size:clamp(46px,15vw,84px);line-height:1.1;letter-spacing:2px}
.speak{margin-top:6px}
.pic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pic{
  background:#fff;border:5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-sm);
  font-size:clamp(46px,15vw,72px);padding:14px 6px;cursor:pointer;
  transition:transform .08s, box-shadow .08s
}
.pic:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* ── 6. 숫자 계산 ──────────────────────── */
.eq-box{
  background:#fff;border:5px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px 12px;text-align:center;margin-bottom:18px
}
.eq{font-family:'Jua',sans-serif;font-size:clamp(40px,13vw,64px);letter-spacing:2px}
.beads{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.bead{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink)}
.bead.a{background:var(--sky)}.bead.b{background:var(--coral)}
.num-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.numbtn{
  font-family:'Jua',sans-serif;font-size:clamp(30px,9vw,44px);background:#FFF3D0;
  border:5px solid var(--ink);border-radius:22px;padding:16px;box-shadow:var(--shadow-sm);
  cursor:pointer;color:var(--ink);transition:transform .08s, box-shadow .08s
}
.numbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* 정답/오답 표시 */
.numbtn.ok,.pic.ok,.patbtn.ok{background:#B7F0CE!important;box-shadow:0 0 0 4px #2FBF71 inset}
.numbtn.no,.pic.no,.patbtn.no{background:#FFC4BC!important;box-shadow:0 0 0 4px #E2483A inset}
.judge{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;min-height:44px}
.judge .lampbig{width:30px;height:30px;border-radius:50%;border:4px solid var(--ink);background:#EDEDF3}
.judge .lampbig.green{background:#2FBF71;box-shadow:0 0 16px #2FBF71}
.judge .lampbig.red{background:#E2483A;box-shadow:0 0 16px #E2483A}
.judge span{font-family:'Jua',sans-serif;font-size:20px}

/* ── 7. 규칙성 찾기 ────────────────────── */
.pattern-box{
  background:#fff;border:5px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px 14px;margin-bottom:18px
}
.pattern-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;justify-items:start}
.pcell{
  width:100%;aspect-ratio:1;border:4px solid var(--ink);border-radius:14px;
  background:#F6F2FF;display:grid;place-items:center;font-size:clamp(20px,6vw,34px)
}
.pcell.blank{background:repeating-linear-gradient(45deg,#FFE9A8 0 8px,#FFF4CF 8px 16px);font-family:'Jua',sans-serif}
.pcell.filled{background:#B7F0CE}
.patbtn{
  background:#fff;border:5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-sm);
  font-size:clamp(40px,13vw,64px);padding:12px 6px;cursor:pointer;
  transition:transform .08s, box-shadow .08s
}
.patbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* ── 영어 단어 ─────────────────────────── */
.en-word{font-family:'Jua',sans-serif;font-size:clamp(40px,13vw,72px);letter-spacing:1px;line-height:1.1}
.en-hint{font-size:16px;opacity:.65;margin-top:2px}
.pic.en{padding:10px 6px}
.pic.en .emo{font-size:clamp(40px,12vw,60px);line-height:1.1}
.pic.en .lbl{font-family:'Jua',sans-serif;font-size:clamp(15px,4.4vw,20px);margin-top:4px;color:var(--ink)}
.learn-card{
  background:#FFF6DA;border:5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-sm);
  padding:14px;margin-top:14px;text-align:center;font-family:'Jua',sans-serif;font-size:22px
}
.learn-card .big{font-size:46px;display:block}

/* ── 나가기 확인 ───────────────────────── */
#leaveAsk{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:18px;
  background:rgba(43,33,64,.55)
}
#leaveAsk.show{display:grid}
.ask-card{
  background:#fff;border:6px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);
  padding:22px 18px;text-align:center;max-width:420px;width:100%;
  animation:pop .25s cubic-bezier(.2,1.4,.4,1)
}
.ask-pics{font-size:clamp(38px,12vw,54px);line-height:1.2;letter-spacing:6px}
.ask-title{font-family:'Jua',sans-serif;font-size:26px;margin:8px 0 2px}
.ask-sub{font-size:15px;opacity:.65;margin:0 0 18px}
.ask-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.askbtn{
  border:5px solid var(--ink);border-radius:24px;padding:14px 8px;cursor:pointer;
  box-shadow:var(--shadow-sm);color:var(--ink);transition:transform .08s, box-shadow .08s
}
.askbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.askbtn .mark{font-size:clamp(40px,12vw,54px);line-height:1;display:block}
.askbtn .pic{font-size:30px;background:none;border:0;box-shadow:none;padding:0;display:block;margin-top:2px}
.askbtn .cap{font-family:'Jua',sans-serif;font-size:17px;display:block;margin-top:4px}
.askbtn.yes{background:#FFD3CC}
.askbtn.no{background:#CFF3E3}

/* ── 결과 ─────────────────────────────── */
.result-emoji{font-size:88px;line-height:1;animation:bounce 1s infinite alternate}
.res-star-info{
  font-family:'Jua',sans-serif;font-size:17px;background:#FFF0CC;border:4px solid var(--ink);
  border-radius:16px;padding:10px 12px;margin:14px 0 0
}
.res-star-info:empty{display:none}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.result-stars{font-size:34px;letter-spacing:4px;margin:10px 0}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.bigbtn{
  font-family:'Jua',sans-serif;font-size:20px;border:4px solid var(--ink);border-radius:999px;
  padding:14px 26px;box-shadow:var(--shadow-sm);cursor:pointer;color:var(--ink);
  transition:transform .08s, box-shadow .08s
}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bigbtn.primary{background:var(--mint)}
.bigbtn.second{background:#fff}

/* 축하 조각 */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.conf{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

:focus-visible{outline:4px solid #2B2140;outline-offset:3px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="chip" id="btnHome">🏠 홈</button>
    <div id="topTitle">놀이</div>
    <button class="chip ghost" id="btnSound">🔊</button>
  </header>

  <!-- 홈 -->
  <section id="screen-home" class="screen is-active">
    <div class="home-head">
      <span class="eyebrow">해솔이랑 동건이랑</span>
      <h1 class="home-title"><span>해</span><span>솔</span><span>동</span><span>건</span><span>놀</span><span>이</span><span>터</span></h1>
      <p class="home-sub">오늘은 어떤 놀이를 할까?</p>

    <div class="cat cat-earn">

    <div class="cat cat-spend">
      <span class="cat-ico">🎟️</span>

      <span class="cat-note">한 판에 별 −1</span>
    </div>

  <!-- 난이도/모드 고르기 -->
  <section id="screen-options" class="screen">
    <div class="panel">
      <h2 id="optTitle">어떻게 할까?</h2>

    <div class="playhead" id="playhead"></div>

  </section>

  <!-- 결과 -->
  <section id="screen-result" class="screen">
    <div class="panel">
      <div class="result-emoji" id="resEmoji">🎉</div>
      <h2 id="resTitle">잘했어!</h2>
      <div class="result-stars" id="resStars">⭐⭐⭐</div>
      <p id="resSub"></p>
      <p id="resStarInfo" class="res-star-info"></p>

        <button class="bigbtn primary" id="btnAgain">한 번 더</button>

</div>
<div id="confetti"></div>
<div id="leaveAsk" role="dialog" aria-modal="true" aria-label="놀이를 그만할까요?">
  <div class="ask-card">
    <div class="ask-pics">🎮 ➡️ 🏠</div>
    <div class="ask-title">정말 나갈까?</div>
    <p class="ask-sub">지금 놀이는 처음부터 다시 시작해요</p>
    <div class="ask-row">
      <button class="askbtn yes" id="askYes">
        <span class="mark">⭕</span><span class="pic">🏠</span><span class="cap">나갈래</span>
      </button>
      <button class="askbtn no" id="askNo">
        <span class="mark">❌</span><span class="pic">🎮</span><span class="cap">더 할래</span>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ═══════════ 공통 도구 ═══════════ */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => {const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];} return b;};
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ── 소리 ── */
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(freq, start, dur, type, vol){
  const c=ac(); if(!c||muted) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, c.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol||0.14, c.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+start+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+0.05);
}
const sfx = {
  tap(){ tone(660,0,.08,'triangle',.10); },
  good(){ tone(659,0,.12,'triangle',.14); tone(880,.09,.16,'triangle',.14); },
  bad(){ tone(200,0,.18,'sawtooth',.09); },
  flip(){ tone(520,0,.06,'sine',.09); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.22,'triangle',.15)); },
  lose(){ [392,330,262].forEach((f,i)=>tone(f,i*.13,.25,'sine',.12)); }
};
$('#btnSound').addEventListener('click', function(){
  muted=!muted; this.textContent = muted?'🔇':'🔊';
});

function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=$('#confetti'), bits=['⭐','🎈','🎊','💛','🌈','✨'];
  for(let i=0;i<26;i++){
    const s=el('span','conf',pick(bits));
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    s.style.animationDelay=(Math.random()*.5)+'s';
    box.appendChild(s);
    setTimeout(()=>s.remove(),3600);
  }
}

/* ── 화면 전환 ── */
function show(id, title){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('is-active'));
  $('#screen-'+id).classList.add('is-active');
  $('#topbar').classList.toggle('show', id!=='home');
  if(title) $('#topTitle').textContent=title;
  window.scrollTo(0,0);
}

/* ── 진행 표시 ── */
function setHead(html){ $('#playhead').innerHTML = html; }
function pips(done,total){
  let h='<div class="pips">';
  for(let i=0;i<total;i++) h+='<div class="pip'+(i<done?' on':'')+'"></div>';
  return h+'</div>';
}

/* ═══════════ 게임 목록 ═══════════ */
/* ═══════════ 별 모으기 · 별 쓰기 ═══════════ */
const MAX_TOTAL = 10;   // 가질 수 있는 별
const MAX_PER_GAME = 5; // 한 놀이에서 모을 수 있는 별
const SAVE_KEY = 'haesol_donggeon_playground_v1';
let bank = {};          // 놀이별로 모아둔 별

function loadSave(){
  try{
    const raw = window.localStorage.getItem(SAVE_KEY);
    if(raw){ const o=JSON.parse(raw); if(o&&o.bank) bank=o.bank; }
  }catch(e){ bank={}; }
}
function save(){
  try{ window.localStorage.setItem(SAVE_KEY, JSON.stringify({bank:bank})); }catch(e){}
}
function totalStars(){
  let t=0; for(const k in bank) t+=bank[k]||0; return t;
}
function addStar(gid){
  if(totalStars()>=MAX_TOTAL) return 'full';
  if((bank[gid]||0)>=MAX_PER_GAME) return 'capped';
  bank[gid]=(bank[gid]||0)+1; save(); return 'ok';
}
function useStar(){
  let best=null;
  for(const k in bank) if((bank[k]||0)>0 && (best===null || bank[k]>bank[best])) best=k;
  if(best===null) return false;
  bank[best]--; if(!bank[best]) delete bank[best];
  save(); return true;
}
function sayKo(text){
  try{
    if(!('speechSynthesis' in window)||muted) return;
    const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

const GAMES = [
  /* ── 별 모으기 ── */
  {id:'hangul', name:'한글 맞추기',emoji:'🅰️', kind:'earn', star:true, color:'#6FC9F2', options:null},
  {id:'english',name:'영어 단어',  emoji:'🔤', kind:'earn', star:true, color:'#5FD3A6', options:null},
  {id:'math',   name:'숫자 계산',  emoji:'➕', kind:'earn', star:['normal','hard','vhard'], color:'#FFC93C', options:[
      {key:'easy', label:'쉬움', note:'더하기, 답은 10까지'},
      {key:'normal', label:'보통', note:'더하기 빼기, 숫자는 10까지'},
      {key:'hard', label:'어려움', note:'더하기 빼기, 답은 20까지'},
      {key:'vhard', label:'매우 어려움', note:'20까지 나오는 큰 수'}]},
  {id:'pattern',name:'규칙 찾기',  emoji:'🔁', kind:'earn', star:['hard','vhard'], color:'#FF7A6B', options:[
      {key:'easy', label:'쉬움', note:'2개씩 반복 · 5문제'},
      {key:'normal', label:'보통', note:'3개씩 반복 · 5문제'},
      {key:'hard', label:'어려움', note:'4개씩 반복 · 5문제'},
      {key:'vhard', label:'매우 어려움', note:'2·3·4개 반복 섞기 · 10문제'}]},
  {id:'memory', name:'짝 맞추기',  emoji:'🐼', kind:'earn', star:['normal','hard','vhard'], color:'#B79BFF', options:[
      {key:'easy', label:'쉬움', note:'카드 6장'},
      {key:'normal', label:'보통', note:'카드 12장'},
      {key:'hard', label:'어려움', note:'카드 16장'},
      {key:'vhard', label:'매우 어려움', note:'카드 20장'}]},
  /* ── 별 쓰기 ── */
  {id:'ttt',    name:'삼목 놀이',  emoji:'⚫', kind:'spend', color:'#FF9F5C', options:[
      {key:'cpu3', label:'컴퓨터랑 · 3×3', note:'초급 컴퓨터, 나는 흑돌', icon:'🧒 🆚 🤖'},
      {key:'cpu5', label:'컴퓨터랑 · 5×5', note:'넓은 판, 3개 나란히', icon:'🧒 🆚 🤖'},
      {key:'two3', label:'둘이서 · 3×3', note:'흑돌과 백돌 번갈아', icon:'🧒 🆚 🧑'},
      {key:'two5', label:'둘이서 · 5×5', note:'넓은 판에서 3개 나란히', icon:'🧒 🆚 🧑'}]},
  {id:'shape',  name:'도형 찾기',  emoji:'🔷', kind:'spend', color:'#5FC7D3', options:[
      {key:'easy', label:'쉬움', note:'4개 중에서 찾기'},
      {key:'normal', label:'보통', note:'10개 중에서 찾기'},
      {key:'hard', label:'어려움', note:'20개 중에서 찾기'},
      {key:'vhard', label:'매우 어려움', note:'20개 중에서 · 비슷한 것끼리'}]},
  {id:'rps',    name:'가위바위보', emoji:'✌️', kind:'spend', color:'#F58FBE', options:null}
];
function gameById(id){ return GAMES.filter(function(g){return g.id===id;})[0]; }
function earnsStar(g,opt){
  if(g.kind!=='earn') return false;
  if(g.star===true) return true;
  return g.star.indexOf(opt)>=0;
}

function renderTiles(){
  // 별 보유량
  const t=totalStars();
  $('#bankNum').textContent = t+' / '+MAX_TOTAL;
  let slots='';
  for(let i=0;i<MAX_TOTAL;i++) slots+='<div class="slot'+(i<t?' on':'')+'">'+(i<t?'⭐':'')+'</div>';
  $('#bankSlots').innerHTML=slots;

  const boxes={earn:$('#tilesEarn'), spend:$('#tilesSpend')};
  boxes.earn.innerHTML=''; boxes.spend.innerHTML='';
  GAMES.forEach(function(g,i){
    const tile=el('button','tile');
    tile.style.background=g.color;
    tile.style.transform='rotate('+(i%2?1.3:-1.3)+'deg)';
    let extra='';
    const locked = g.kind==='spend' && t<=0;
    if(g.kind==='earn'){
      const n=bank[g.id]||0;
      extra='<div class="tile-stars">'+'⭐'.repeat(n)+'☆'.repeat(MAX_PER_GAME-n)+'</div>';
    }else{
      extra='<div class="tile-stars">'+(locked?'별이 필요해':'별 −1')+'</div>'+
            (locked?'<span class="lock">🔒</span>':'<span class="cost">⭐−1</span>');
    }
    if(locked) tile.classList.add('locked');
    tile.innerHTML='<span class="tile-emoji">'+g.emoji+'</span>'+
      '<div class="tile-name">'+g.name+'</div>'+extra;
    tile.addEventListener('click',function(){
      if(locked){ sfx.bad(); sayKo('별을 모아보자'); showLockedNote(); return; }
      sfx.tap(); go(g.id);
    });
    boxes[g.kind].appendChild(tile);
  });
}
function showLockedNote(){
  let n=$('#lockedNote');
  if(!n){
    n=el('div','locked-note','<span class="big">🔒 ⭐</span>별을 모아보자!<br><small>위쪽 놀이를 한 판 끝내면 별이 하나 생겨요</small>');
    n.id='lockedNote';
    $('#screen-home').insertBefore(n, $('#tilesSpend'));
  }
  clearTimeout(showLockedNote.t);
  showLockedNote.t=setTimeout(function(){ if(n&&n.parentNode) n.parentNode.removeChild(n); }, 4000);
}

let current = null;      // {game, opt}
let playing = false;     // 게임 진행 중인지
let curRoute = 'home';   // 지금 보고 있는 주소
let pending = null;      // 확인 후 이동할 주소
let skipHash = false;

function stopAll(){      // 화면을 떠날 때 예약된 동작 정리
  const id = setTimeout(function(){},0);
  for(let i=1;i<=id;i++) clearTimeout(i);
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
}

function go(route){
  const h='#'+route;
  if(location.hash===h){ render(route); return; }
  location.hash=h;       // hashchange → render
}
window.addEventListener('hashchange', function(){
  if(skipHash){ skipHash=false; return; }
  const target=(location.hash||'#home').replace(/^#/,'') || 'home';
  if(target===curRoute) return;
  if(playing){                       // 놀이 중이면 먼저 물어보기
    pending=target;
    skipHash=true;
    location.hash='#'+curRoute;      // 일단 제자리로
    askLeave();
    return;
  }
  render(target);
});

function render(route){
  stopAll();
  curRoute=route;
  const parts=route.split('/');
  const gid=parts[0], opt=parts[1];
  if(!gid||gid==='home'){ playing=false; current=null; renderTiles(); show('home'); return; }
  const g=GAMES.filter(function(x){return x.id===gid;})[0];
  if(!g){ playing=false; renderTiles(); show('home'); return; }
  if(g.options && !opt){ playing=false; openOptions(g); return; }
  startGame(g, g.options?opt:null);
}

function openOptions(g){
  current={game:g,opt:null};
  $('#optTitle').textContent = g.emoji+' '+g.name;
  $('#optSub').textContent = g.id==='ttt' ? '누구랑, 어떤 판에서 할까?' : '어렵게 할까, 쉽게 할까?';
  const list=$('#optList'); list.innerHTML='';
  g.options.forEach(function(o,i){
    const b=el('button','opt o'+(i+1),
      (o.icon?'<span class="opt-ico">'+o.icon+'</span>':'')+
      '<span>'+o.label+'</span><small>'+o.note+'</small>'+
      (earnsStar(g,o.key)?'<span class="earn">⭐ 별 모으기</span>':''));
    b.addEventListener('click',function(){ sfx.tap(); go(g.id+'/'+o.key); });
    list.appendChild(b);
  });
  show('options', g.name);
}

function startGame(g,opt){
  if(g.kind==='spend'){
    if(!useStar()){                       // 별이 없으면 못 들어감
      sfx.bad(); sayKo('별을 모아보자');
      playing=false; renderTiles(); show('home'); curRoute='home';
      skipHash=true; location.hash='#home';
      showLockedNote();
      return;
    }
  }
  current={game:g,opt:opt};
  playing=true;
  show('play', g.name);
  setHead('');
  $('#stage').innerHTML='';
  RUN[g.id](opt);
}

/* 나가기 확인 창 */
function askLeave(){
  sfx.tap();
  $('#leaveAsk').classList.add('show');
}
function closeAsk(){ $('#leaveAsk').classList.remove('show'); }
$('#askYes').addEventListener('click',function(){        // ⭕ 나가기
  closeAsk(); playing=false;
  const t=pending; pending=null;
  if(t) go(t); else go('home');
});
$('#askNo').addEventListener('click',function(){          // ❌ 계속하기
  closeAsk(); pending=null; sfx.tap();
});
function leaveTo(route){
  if(playing){ pending=route; askLeave(); return; }
  go(route);
}

/* ── 결과 화면 ── */
function finish(o){
  if(!playing) return;                 // 이미 나간 놀이의 뒤늦은 호출 무시
  playing=false;
  const s = o.stars==null?3:o.stars;
  $('#resEmoji').textContent = o.emoji || '🎉';
  $('#resTitle').textContent = o.title || '잘했어!';
  $('#resStars').textContent = '⭐'.repeat(s)+'☆'.repeat(3-s);
  $('#resSub').textContent = o.sub || '';

  let note='';
  if(current&&current.game){
    const g=current.game;
    if(earnsStar(g,current.opt)){
      const r=addStar(g.id);
      if(r==='ok') note='⭐ 별을 하나 얻었어! (내 별 '+totalStars()+'개)';
      else if(r==='full') note='별이 가득 찼어 (10개) · 아래 놀이에서 써 보자';
      else note='이 놀이에서는 별 5개까지만 모을 수 있어';
    }else if(g.kind==='earn'){
      note='이 난이도는 별이 없어 · ⭐ 표시된 난이도를 해보자';
    }else{
      note='별 1개를 썼어 · 남은 별 '+totalStars()+'개';
    }
  }
  $('#resStarInfo').textContent = note;

  show('result', current?current.game.name:'놀이');
  if(s>=2){ sfx.win(); confetti(); } else sfx.lose();
  renderTiles();
}
$('#btnAgain').addEventListener('click',function(){ sfx.tap(); if(current) startGame(current.game,current.opt); });
$('#btnBackHome').addEventListener('click',function(){ sfx.tap(); go('home'); });
$('#btnHome').addEventListener('click',function(){ sfx.tap(); leaveTo('home'); });

const RUN = {};

/* ═══════════ 1. 도형 찾기 ═══════════ */
const SHAPES = {
  circle:'<circle cx="50" cy="50" r="40"/>',
  square:'<rect x="12" y="12" width="76" height="76" rx="10"/>',
  triangle:'<polygon points="50,10 92,86 8,86"/>',
  star:'<polygon points="50,6 61,38 95,38 67,58 78,90 50,70 22,90 33,58 5,38 39,38"/>',
  heart:'<path d="M50,86 C20,63 8,45 8,33 A21,21 0 0 1 50,25 A21,21 0 0 1 92,33 C92,45 80,63 50,86 Z"/>'
};
const SHAPE_KEYS = Object.keys(SHAPES);
const SHAPE_COLORS = ['#FF5A5A','#3FA9F5','#FFC93C','#4CD07D','#A97BFF','#FF9F5C','#FF7FB6','#3FD0C9'];
const SHAPE_COLORS_V = SHAPE_COLORS.concat(['#FF8A8A','#7FC6F7','#FFE07A','#8FE3B0','#C9AEFF']);
function svgShape(shape,color){
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="'+color+'" stroke="#2B2140" stroke-width="5" stroke-linejoin="round">'+SHAPES[shape]+'</g></svg>';
}
RUN.shape = function(opt){
  const count = opt==='easy'?4:(opt==='normal'?10:20);
  const vhard = opt==='vhard';
  const COLORS = vhard?SHAPE_COLORS_V:SHAPE_COLORS;
  const TOTAL=10; let round=0, wrong=0;
  next();
  function next(){
    if(round>=TOTAL){
      finish({emoji:'🔷',title:'도형 박사!',stars: wrong===0?3:(wrong<=3?2:1),
              sub:'틀린 횟수 '+wrong+'번'});
      return;
    }
    round++;
    setHead(pips(round-1,TOTAL)+'<span class="banner">같은 걸 찾아봐</span>');
    const target={s:pick(SHAPE_KEYS), c:pick(COLORS)};
    const used=new Set([target.s+target.c]);
    const opts=[target];
    if(vhard){
      // 같은 모양(색만 다름) + 같은 색(모양만 다름) 위주로 헷갈리게
      const near=[];
      COLORS.forEach(c=>{ if(c!==target.c) near.push({s:target.s,c:c}); });
      SHAPE_KEYS.forEach(s=>{ if(s!==target.s) near.push({s:s,c:target.c}); });
      shuffle(near).forEach(o=>{
        if(opts.length<count && !used.has(o.s+o.c)){ used.add(o.s+o.c); opts.push(o); }
      });
    }
    let guard=0;
    while(opts.length<count && guard++<400){
      const o={s:pick(SHAPE_KEYS), c:pick(COLORS)};
      if(used.has(o.s+o.c)) continue;
      used.add(o.s+o.c); opts.push(o);
    }
    const list=shuffle(opts);
    const stage=$('#stage');
    stage.innerHTML='<div class="target-box">'+svgShape(target.s,target.c)+'</div>'+
      '<div class="shape-grid'+(count>10?' lots':(count>4?' many':''))+'" id="sgrid"></div>';
    const grid=$('#sgrid');
    list.forEach(o=>{
      const b=el('button','shape-btn',svgShape(o.s,o.c));
      b.addEventListener('click',()=>{

const ANIMALS=['🐶','🐱','🐰','🐻','🐼','🦊','🐯','🦁','🐷','🐸','🐵','🐨','🐮','🐧'];
RUN.memory = function(opt){
  const n = opt==='easy'?6:(opt==='normal'?12:(opt==='hard'?16:20));
  const cols = n===6?3:4;
  const pairs = shuffle(ANIMALS).slice(0,n/2);
  const deck = shuffle(pairs.concat(pairs));
  let first=null, lock=false, found=0, tries=0;
  const stage=$('#stage');
  stage.innerHTML='<div class="mem-grid" id="mgrid"></div>';
  const grid=$('#mgrid');
  grid.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
  grid.style.maxWidth = (cols*110)+'px';
  grid.style.margin='0 auto';
  head();
  function head(){ setHead('<span class="banner">🐾 짝 '+found+' / '+(n/2)+'</span><span class="banner">뒤집기 '+tries+'번</span>'); }
  deck.forEach((emoji,i)=>{
    const c=el('div','mcard');
    c.innerHTML='<div class="mcard-inner"><div class="mface front">🐾</div><div class="mface back">'+emoji+'</div></div>';
    c.dataset.emoji=emoji;
    c.addEventListener('click',()=>flip(c));
    grid.appendChild(c);
  });
  function flip(c){
    if(lock||c.classList.contains('flipped')||c.classList.contains('done')) return;
    c.classList.add('flipped'); sfx.flip();
    if(!first){ first=c; return; }
    lock=true; tries++; head();
    if(first.dataset.emoji===c.dataset.emoji){
      sfx.good();
      const a=first; first=null;
      setTimeout(()=>{
        a.classList.add('done'); c.classList.add('done');
        found++; head(); lock=false;
        if(found===n/2){
          const g3=Math.floor(n*1.5), g2=n*2;
          const st = tries<=g3?3:(tries<=g2?2:1);
          setTimeout(()=>finish({emoji:'🐼',title:'짝을 다 찾았어!',stars:st,
            sub:tries+'번 만에 다 뒤집었어 (별 3개는 '+g3+'번 이내)'}),450);
        }
      },420);
    }else{
      sfx.bad();
      const a=first; first=null;
      setTimeout(()=>{ a.classList.remove('flipped'); c.classList.remove('flipped'); lock=false; },850);
    }
  }
};

/* ═══════════ 3. 틱택토 (흑돌·백돌) ═══════════ */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function makeLines(size){
  const L=[], idx=(r,c)=>r*size+c;
  for(let r=0;r<size;r++) for(let c=0;c<size;c++){
    if(c+2<size) L.push([idx(r,c),idx(r,c+1),idx(r,c+2)]);
    if(r+2<size) L.push([idx(r,c),idx(r+1,c),idx(r+2,c)]);
    if(r+2<size&&c+2<size) L.push([idx(r,c),idx(r+1,c+1),idx(r+2,c+2)]);
    if(r+2<size&&c-2>=0) L.push([idx(r,c),idx(r+1,c-1),idx(r+2,c-2)]);
  }
  return L;
}
RUN.ttt = function(opt){
  const key = opt||'cpu3';
  const vsCpu = key.indexOf('cpu')===0;
  const size = key.indexOf('5')>=0 ? 5 : 3;
  const MISS = size===3 ? 0.40 : 0.20;      // 판이 넓으면 실수를 줄임
  const LINES = makeLines(size);
  const cells = size*size;
  let board=Array(cells).fill(null), turn='B', over=false;
  const stage=$('#stage');
  stage.innerHTML='<div class="turnbar" id="turnbar"></div>'+
    '<div class="ttt-board'+(size===5?' big':'')+'" id="board"></div>'+
    '<div class="btn-row"><button class="bigbtn second" id="tttReset">다시 놓기</button></div>';
  const board_el=$('#board');
  for(let i=0;i<cells;i++){
    const c=el('button','ttt-cell'); c.dataset.i=i;
    c.addEventListener('click',()=>play(i));
    board_el.appendChild(c);
  }
  $('#tttReset').addEventListener('click',()=>{ sfx.tap(); board=Array(cells).fill(null); turn='B'; over=false; draw(); });
  draw();

  function draw(){
    board.forEach((v,i)=>{
      const c=board_el.children[i];
      c.innerHTML = v ? '<div class="stone '+(v==='B'?'black':'white')+'"></div>' : '';
      c.classList.remove('win');
    });
    const who = vsCpu ? (turn==='B'?'내 차례':'컴퓨터 차례') : (turn==='B'?'흑돌 차례':'백돌 차례');
    $('#turnbar').innerHTML = over?'' :
      '<div class="turn-stone" style="background:'+(turn==='B'?'radial-gradient(circle at 32% 28%,#7a7a8f,#1b1626 62%)':'radial-gradient(circle at 32% 28%,#fff,#d6d6e2 70%)')+'"></div><span class="banner">'+who+'</span>';
    setHead('<span class="banner">'+(vsCpu?'⚫ 나 vs 컴퓨터 ⚪':'⚫ 흑돌 vs 백돌 ⚪')+'</span>'+
            '<span class="banner">'+size+'×'+size+' · 3개 나란히</span>');
  }
  function play(i){
    if(over||board[i]) return;
    if(vsCpu && turn!=='B') return;
    move(i);
    if(!over && vsCpu && turn==='W') setTimeout(cpuMove,600);
  }
  function move(i){
    board[i]=turn; sfx.tap();
    const w=winner();
    draw();
    if(w){ endGame(w); return; }
    if(board.every(Boolean)){ endGame('draw'); return; }
    turn = turn==='B'?'W':'B';
    draw();
  }
  function cpuMove(){                       // 초급 컴퓨터
    if(over) return;
    const empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(!empty.length) return;
    let choice;
    if(Math.random()<MISS){ choice=pick(empty); }      // 초급: 가끔 엉뚱한 곳에
    else{
      choice = findLine('W');                            // 이길 자리
      if(choice==null) choice = findLine('B');           // 막을 자리
      if(choice==null && size===3 && board[4]===null) choice = 4;
      if(choice==null) choice = pick(nearStones(empty));
    }
    if(choice==null||board[choice]) choice=pick(empty);
    move(choice);
  }
  function nearStones(empty){               // 돌 근처에 두기
    const near=empty.filter(i=>{
      const r=Math.floor(i/size), c=i%size;
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const nr=r+dr, nc=c+dc;
        if(nr<0||nc<0||nr>=size||nc>=size) continue;
        if(board[nr*size+nc]) return true;
      }
      return false;
    });
    return near.length?near:empty;
  }
  function findLine(p){
    const cands=[];
    for(const L of LINES){
      const vals=L.map(i=>board[i]);
      if(vals.filter(v=>v===p).length===2 && vals.indexOf(null)>=0) cands.push(L[vals.indexOf(null)]);
    }
    return cands.length?pick(cands):null;
  }
  function winner(){
    for(const L of LINES){
      if(board[L[0]]&&board[L[0]]===board[L[1]]&&board[L[1]]===board[L[2]]) return {p:board[L[0]],line:L};
    }
    return null;
  }
  function endGame(res){
    over=true;
    if(res!=='draw'){ res.line.forEach(i=>board_el.children[i].classList.add('win')); }
    $('#turnbar').innerHTML='';
    setTimeout(()=>{
      if(res==='draw'){ finish({emoji:'🤝',title:'비겼어!',stars:2,sub:'다시 한 번 해볼까?'}); return; }
      if(vsCpu){
        if(res.p==='B') finish({emoji:'🏆',title:'내가 이겼다!',stars:3,sub:'흑돌 3개를 나란히 놓았어'});
        else finish({emoji:'🙂',title:'컴퓨터가 이겼어',stars:1,sub:'상대 돌이 2개 되면 먼저 막아보자'});
      }else{
        finish({emoji: res.p==='B'?'⚫':'⚪', title:(res.p==='B'?'흑돌':'백돌')+' 승리!',stars:3,sub:'3개를 나란히 놓았어'});
      }
    },700);
  }
};

/* ═══════════ 4. 가위바위보 (신호등 점수) ═══════════ */
const RPS=[{k:'가위',e:'✌️'},{k:'바위',e:'✊'},{k:'보',e:'✋'}];
const BEATS={가위:'보', 바위:'가위', 보:'바위'}; // 이기는 상대
RUN.rps = function(){
  let me=0, cpu=0, busy=false;
  const stage=$('#stage');
  stage.innerHTML =
    '<div class="rps-wrap">'+
      '<div class="signal" id="sigMe"></div>'+
      '<div class="arena">'+
        '<div class="hands"><div class="hand" id="handMe">❔</div><span class="vs">vs</span><div class="hand" id="handCpu">❔</div></div>'+
        '<div class="rps-result" id="rpsMsg">가위바위보!</div>'+
      '</div>'+
      '<div class="signal" id="sigCpu"></div>'+
    '</div>'+
    '<div class="rps-pick" id="rpsPick"></div>';
  const pickBox=$('#rpsPick');
  RPS.forEach(o=>{
    const b=el('button','pickbtn', o.e+'<div>'+o.k+'</div>');
    b.addEventListener('click',()=>go(o));
    pickBox.appendChild(b);
  });
  lights();
  setHead('<span class="banner">🚦 3번 먼저 이기면 승리</span>');

  function lights(){
    let a='<span class="who">나</span>', b='<span class="who">컴</span>';
    for(let i=0;i<3;i++){ a+='<div class="lamp me'+(i<me?' on':'')+'"></div>'; b+='<div class="lamp cpu'+(i<cpu?' on':'')+'"></div>'; }
    $('#sigMe').innerHTML=a; $('#sigCpu').innerHTML=b;
  }
  async function go(mine){
    if(busy) return; busy=true;
    $('#handMe').textContent=mine.e;
    $('#rpsMsg').textContent='컴퓨터가 고르는 중…';
    const h=$('#handCpu'); h.classList.add('thinking');
    for(let i=0;i<9;i++){ h.textContent=RPS[i%3].e; await wait(90); }
    h.classList.remove('thinking');

    // 결과 확률: 사람 승 50%, 비김 30%, 컴퓨터 승 20%
    const r=Math.random();
    let outcome = r<0.50?'win':(r<0.80?'draw':'lose');
    let cpuPick;
    if(outcome==='draw') cpuPick = mine.k;
    else if(outcome==='win') cpuPick = BEATS[mine.k];              // 내가 이기는 상대
    else cpuPick = Object.keys(BEATS).find(k=>BEATS[k]===mine.k);  // 나를 이기는 손
    const cpuObj = RPS.find(o=>o.k===cpuPick);
    h.textContent=cpuObj.e;

    if(outcome==='win'){ me++; sfx.good(); $('#rpsMsg').textContent='이겼다! 🎉'; }
    else if(outcome==='draw'){ sfx.flip(); $('#rpsMsg').textContent='비겼네 🤝'; }
    else { cpu++; sfx.bad(); $('#rpsMsg').textContent='컴퓨터가 이겼어 😮'; }
    lights();

    await wait(900);
    if(me>=3){ finish({emoji:'🏆',title:'3번 이겼다!',stars:3,sub:'신호등에 초록불이 다 켜졌어'}); return; }
    if(cpu>=3){ finish({emoji:'💪',title:'아쉬워, 다시 해보자',stars:1,sub:'컴퓨터가 먼저 3번 이겼어'}); return; }
    $('#handMe').textContent='❔'; $('#handCpu').textContent='❔';
    $('#rpsMsg').textContent='가위바위보!';
    busy=false;
  }
};

        if(state==='done') return;
        const right = (w[0]===item[0]);
        if(state==='reveal'){                 // 정답을 눌러 발음을 들어야 다음 문제로
          if(!right){ jtext.textContent='초록색 그림을 눌러 보자'; return; }
          state='done'; say(item[0]); sfx.good();
          jtext.textContent=item[0]+' — '+item[2];
          setTimeout(next,1800); return;
        }
        say(w[0]);                            // 고른 그림의 단어를 읽어줍니다
        if(right){
          state='done'; if(tries<=2) solved++;
          sfx.good(); b.classList.add('ok','correct-pop');
          lamp.classList.add('green'); jtext.textContent='맞았어!';
          learn(item); setTimeout(next,2400);
        }else{
          tries++; sfx.bad(); b.classList.add('shake');
          setTimeout(()=>b.classList.remove('shake'),420);
          if(tries>=3){
            state='reveal'; b.classList.add('no');
            const rightBtn=Array.from(grid.children).find(n=>n.dataset.w===item[0]);
            if(rightBtn) rightBtn.classList.add('ok');
            lamp.classList.add('red');
            jtext.textContent='정답을 눌러서 들어보자';
            learn(item);
          }else{
            jtext.textContent='다시 들어보고 골라 보자';
          }
        }
      });
      grid.appendChild(b);
    });
    function learn(it){
      $('#learn').innerHTML='<div class="learn-card"><span class="big">'+it[1]+'</span>'+it[0]+' — '+it[2]+'</div>';
    }
  }
};

/* ═══════════ 6. 숫자 계산 ═══════════ */
RUN.math = function(opt){
  const TOTAL=10; let round=0, solved=0;
  next();
  function makeQ(){
    let a,b,op,ans;
    if(opt==='easy'){
      op='+'; a=1+rnd(9); b=1+rnd(10-a); ans=a+b;                       // 답 10 이하
    }else if(opt==='normal'){
      op = Math.random()<.5?'+':'-';
      if(op==='+'){ a=1+rnd(9); b=1+rnd(10-a); ans=a+b; }               // 답 10 이하
      else { a=2+rnd(9); b=1+rnd(a); ans=a-b; }                         // 숫자 10까지, 답 0 이상
    }else if(opt==='hard'){
      op = Math.random()<.5?'+':'-';
      if(op==='+'){ a=1+rnd(9); b=1+rnd(9); ans=a+b; }                  // 두 수 모두 한 자리
      else { a=1+rnd(9); b=rnd(a+1); ans=a-b; }
    }else{
      op = Math.random()<.5?'+':'-';
      if(op==='+'){ a=5+rnd(15); b=1+rnd(9); if(a+b>20){a=20-b;} ans=a+b; } // 큰 수 하나(최대 20)
      else { a=10+rnd(11); b=1+rnd(9); ans=a-b; }
    }
    return {a:a,b:b,op:op,ans:ans};
  }
  function next(){
    if(round>=TOTAL){
      finish({emoji:'🧮',title:'계산 척척!',stars: solved>=8?3:(solved>=6?2:1),
              sub:'두 번 안에 맞춘 문제 '+solved+' / '+TOTAL});
      return;
    }
    const q=makeQ(); round++;
    let tries=0, done=false;
    setHead(pips(round-1,TOTAL)+'<span class="banner">답은 몇일까?</span>');
    let beads='';
    if(opt==='easy'){
      beads='<div class="beads">'+'<div class="bead a"></div>'.repeat(q.a)+'<div class="bead b"></div>'.repeat(q.b)+'</div>';
    }
    $('#stage').innerHTML='<div class="eq-box"><div class="eq" id="eqline">'+q.a+' '+(q.op==='+'?'＋':'－')+' '+q.b+' ＝ ?</div>'+beads+
      '<div class="judge" id="judge"><div class="lampbig"></div><span id="judgeText">골라 보자</span></div></div>'+
      '<div class="num-grid" id="ngrid"></div>';
    const set=new Set([q.ans]);
    let guard=0;
    while(set.size<4 && guard++<80){
      const d=q.ans + (rnd(2)?1:-1)*(1+rnd(4));
      if(d>=0 && d<=30) set.add(d);
    }
    while(set.size<4) set.add(rnd(21));
    const list=shuffle(Array.from(set));
    const grid=$('#ngrid');
    const lamp=$('#judge .lampbig'), jtext=$('#judgeText'), eqline=$('#eqline');
    list.forEach(v=>{
      const b=el('button','numbtn',String(v));
      b.dataset.v=v;
      b.addEventListener('click',()=>{
        if(done) return;
        if(v===q.ans){
          done=true; solved++; sfx.good();
          b.classList.add('ok','correct-pop');
          eqline.textContent = q.a+' '+(q.op==='+'?'＋':'－')+' '+q.b+' ＝ '+q.ans;
          lamp.classList.add('green'); jtext.textContent='맞았어!';
          setTimeout(next,1100);
        }else{
          tries++;
          sfx.bad(); b.classList.add('shake');
          setTimeout(()=>b.classList.remove('shake'),420);
          if(tries>=2){
            done=true;
            b.classList.add('no');
            const right=Array.from(grid.children).find(x=>Number(x.dataset.v)===q.ans);
            if(right) right.classList.add('ok');
            eqline.textContent = q.a+' '+(q.op==='+'?'＋':'－')+' '+q.b+' ＝ '+q.ans;
            lamp.classList.add('red'); jtext.textContent='정답은 '+q.ans+'이야';
            setTimeout(next,1900);
          }else{
            jtext.textContent='한 번 더 해보자';
          }
        }
      });
      grid.appendChild(b);
    });
  }
};

/* ═══════════ 7. 규칙 찾기 ═══════════ */
const PAT_POOLS = [
  ['🍉','🍎','🍌','🍇','🍓'],          // 과일
  ['🐶','🐱','🐰','🐻','🐸'],          // 동물
  ['🔴','🔵','🟡','🟢','🟣'],          // 색깔
  ['⭐','❤️','🔺','⬛','🌙'],          // 모양
  ['🚗','🚌','✈️','🚂','🚲'],          // 탈것
  ['⚽','🎈','🎁','👟','📚']           // 사물
];
const PAT_2 = [[0,1]];                                  // 2개 반복 AB
const PAT_3 = [[0,1,1],[0,0,1],[0,1,2]];                // 3개 반복 ABB, AAB, ABC
const PAT_4 = [[0,0,1,1],[0,1,2,2],[0,1,0,2],[0,1,2,3]];// 4개 반복 AABB, ABCC, ABAC, ABCD
const PAT_BY_LEN = {2:PAT_2, 3:PAT_3, 4:PAT_4};
const MAX_CARDS = 12;                                   // 가로 6 × 2줄
RUN.pattern = function(opt){
  const key = opt||'easy';
  const TOTAL = key==='vhard' ? 10 : 5;
  let round=0, solved=0;
  next();
  function unitLen(){
    if(key==='easy') return 2;
    if(key==='normal') return 3;
    if(key==='hard') return 4;
    return pick([2,3,4]);                                // 매우 어려움: 섞어서
  }
  function next(){
    if(round>=TOTAL){
      const g3=Math.ceil(TOTAL*0.9), g2=Math.ceil(TOTAL*0.7);
      finish({emoji:'🔁',title:'규칙을 찾았어!',stars: solved>=g3?3:(solved>=g2?2:1),
              sub:'두 번 안에 맞춘 문제 '+solved+' / '+TOTAL});
      return;
    }
    round++;
    const pool=shuffle(pick(PAT_POOLS));
    const len=unitLen();
    const unit=pick(PAT_BY_LEN[len]);
    const items=pool.slice(0, Math.max.apply(null,unit)+1);

    // 카드 총 개수(빈칸 포함)를 랜덤으로 → 패턴의 몇 번째를 맞출지가 달라짐
    // 두 번 반복은 반드시 보여주기: 보이는 칸 ≥ len*2
    const minTotal = len*2 + 1;
    const total = minTotal + rnd(MAX_CARDS - minTotal + 1);
    const showLen = total - 1;
    const seq=[];
    for(let r=0;r<Math.ceil((showLen+1)/len)+1;r++) for(const u of unit) seq.push(items[u]);
    const shown=seq.slice(0,showLen);
    const answer=seq[showLen];

    let tries=0, done=false;
    setHead(pips(round-1,TOTAL)+'<span class="banner">다음에 올 건 뭘까?</span>');
    let cells=shown.map(x=>'<div class="pcell">'+x+'</div>').join('');
    cells+='<div class="pcell blank" id="blank">?</div>';
    $('#stage').innerHTML='<div class="pattern-box"><div class="pattern-row">'+cells+'</div>'+
      '<div class="judge" id="judge"><div class="lampbig"></div><span id="judgeText">규칙을 찾아봐</span></div></div>'+
      '<div class="pic-grid" id="pgrid"></div>';
    const others=shuffle(items.filter(x=>x!==answer).concat(pool.filter(x=>items.indexOf(x)<0))).slice(0,3);
    const list=shuffle([answer].concat(others));
    const grid=$('#pgrid');
    const lamp=$('#judge .lampbig'), jtext=$('#judgeText'), blank=$('#blank');
    list.forEach(x=>{
      const b=el('button','patbtn pic',x);
      b.addEventListener('click',()=>{
        if(done) return;
        if(x===answer){
          done=true; solved++; sfx.good();
          b.classList.add('ok','correct-pop');
          blank.classList.remove('blank'); blank.classList.add('filled'); blank.textContent=answer;
          lamp.classList.add('green'); jtext.textContent='맞았어!';
          setTimeout(next,1100);
        }else{
          tries++; sfx.bad(); b.classList.add('shake');
          setTimeout(()=>b.classList.remove('shake'),420);
          if(tries>=2){
            done=true; b.classList.add('no');
            const right=Array.from(grid.children).find(n=>n.textContent===answer);
            if(right) right.classList.add('ok');
            blank.classList.remove('blank'); blank.classList.add('filled'); blank.textContent=answer;
            lamp.classList.add('red'); jtext.textContent='정답은 이거야';
            setTimeout(next,1900);
          }else{
            jtext.textContent='한 번 더 해보자';
          }
        }
      });
      grid.appendChild(b);
    });
  }
};
